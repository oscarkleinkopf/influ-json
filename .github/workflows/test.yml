name: Test & smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Unit / integration tests
        run: npm test
        env:
          DISABLE_GIT_BACKUP: '1'
          ENABLE_GIT_BACKUP: ''
          INFLU_SKIP_ENV_PERSIST: '1'
          STUDIO_PIN: '1234'
          SESSION_SECRET: 'ci-session-secret'

      - name: Happy-path smoke (9 checks)
        run: npm run smoke
        env:
          DISABLE_GIT_BACKUP: '1'
          ENABLE_GIT_BACKUP: ''
          INFLU_SKIP_ENV_PERSIST: '1'
          STUDIO_PIN: '1234'
          SESSION_SECRET: 'ci-session-secret'

      - name: Layout smoke (Chrome width + screenshots hubs)
        run: npm run layout-smoke
        env:
          DISABLE_GIT_BACKUP: '1'
          ENABLE_GIT_BACKUP: ''
          INFLU_SKIP_ENV_PERSIST: '1'
          STUDIO_PIN: '1234'
          SESSION_SECRET: 'ci-session-secret'
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          LAYOUT_SHOT_DIR: artifacts
          LAYOUT_SHOT_PATH: artifacts/layout-smoke-dashboard.png

      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-smoke
          path: |
            artifacts/layout-smoke-dashboard.png
            artifacts/*.png
            artifacts/layout-smoke-report.json
          if-no-files-found: ignore
