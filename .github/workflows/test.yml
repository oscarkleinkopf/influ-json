name: Test & smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit / integration tests
        run: npm test
        env:
          DISABLE_GIT_BACKUP: '1'
          ENABLE_GIT_BACKUP: ''
          INFLU_SKIP_ENV_PERSIST: '1'
          STUDIO_PIN: '1234'
          SESSION_SECRET: 'ci-session-secret'

      - name: Happy-path smoke (9 checks)
        run: npm run smoke
        env:
          DISABLE_GIT_BACKUP: '1'
          ENABLE_GIT_BACKUP: ''
          INFLU_SKIP_ENV_PERSIST: '1'
          STUDIO_PIN: '1234'
          SESSION_SECRET: 'ci-session-secret'
